; Self-contained hardware diagnostic project for Headhunters ESP-32D console.
; Flash & monitor with: ./run_test.sh

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DMFRC522_SPICLOCK=1000000u
lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SH110X@^2.1.11
