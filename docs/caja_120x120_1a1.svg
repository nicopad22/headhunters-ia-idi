<?xml version="1.0" encoding="UTF-8"?>
<!--
  True 1:1 millimeter-scale reference template for the Headhunters Console Box (120 x 120 mm).
  1 SVG user unit = 1 mm. Safe to import directly into Inkscape, Illustrator, Rhino, or AutoCAD.
  Colors:
    RED   (#dc2626) = Outer box boundary & lid cutouts (verify button/OLED holes with calipers!)
    BLUE  (#2563eb) = Internal cavity (3 mm walls) & NFC antenna keep-out zone (NO METAL below)
    GRAY  (#475569) = Internal component footprints (for layout verification only — do not cut)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="120mm" viewBox="0 0 120 120">
  <g id="outer_cut" fill="none" stroke="#dc2626" stroke-width="0.4">
    <!-- 120 x 120 mm external enclosure outline -->
    <rect x="0.2" y="0.2" width="119.6" height="119.6" rx="2" />
  </g>

  <g id="inner_wall_ref" fill="none" stroke="#2563eb" stroke-width="0.25" stroke-dasharray="2 1.5">
    <!-- 114 x 114 mm internal cavity (3 mm walls) -->
    <rect x="3" y="3" width="114" height="114" rx="1" />
  </g>

  <g id="oled_1_3_sh1106">
    <!-- OLED PCB footprint: 35.4 x 33.5 mm at (10, 10) -->
    <rect x="10" y="10" width="35.4" height="33.5" fill="none" stroke="#475569" stroke-width="0.3" stroke-dasharray="1.5 1" />
    <!-- OLED active viewing window cutout: 30.0 x 15.5 mm -->
    <rect x="12.7" y="18.0" width="30.0" height="15.5" rx="0.5" fill="none" stroke="#dc2626" stroke-width="0.35" />
    <text x="27.7" y="26.8" text-anchor="middle" font-family="sans-serif" font-size="3.2" fill="#475569">OLED 30x15.5</text>
  </g>

  <g id="buzzer_ref">
    <!-- Passive buzzer: Ø 12 mm at (56, 22) + Ø 3 mm sound hole -->
    <circle cx="56" cy="22" r="6" fill="none" stroke="#475569" stroke-width="0.3" stroke-dasharray="1.5 1" />
    <circle cx="56" cy="22" r="1.5" fill="none" stroke="#dc2626" stroke-width="0.3" />
    <text x="56" y="31.5" text-anchor="middle" font-family="sans-serif" font-size="2.8" fill="#475569">Buz 12mm</text>
  </g>

  <g id="rc522_nfc_zone">
    <!-- RC522 PCB: 40 x 60 mm at (70, 10) — mounted flush under 2-3 mm acrylic, EMPTY AIR below -->
    <rect x="70" y="10" width="40" height="60" rx="1.5" fill="none" stroke="#2563eb" stroke-width="0.4" />
    <!-- Engraved scan target circle on top acrylic (Ø 32 mm) -->
    <circle cx="90" cy="36" r="16" fill="none" stroke="#2563eb" stroke-width="0.3" stroke-dasharray="2 1" />
    <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-size="3.4" fill="#2563eb">RC522 NFC</text>
    <text x="90" y="39.5" text-anchor="middle" font-family="sans-serif" font-size="2.8" fill="#2563eb">40x60 (no metal)</text>
  </g>

  <g id="esp32d_floor_footprint">
    <!-- ESP-32D on floor: 55 x 28 mm at (5, 50); USB-C cable routes down through bottom MDF hole into 15 mm under-board space -->
    <rect x="5" y="50" width="55" height="28" rx="1" fill="none" stroke="#475569" stroke-width="0.35" stroke-dasharray="2 1" />
    <!-- Reference marker for bottom MDF USB-C pass-through hole (already cut in base; not a lid/wall cut) -->
    <rect x="4" y="58" width="12" height="12" rx="2" fill="none" stroke="#475569" stroke-width="0.4" stroke-dasharray="1.5 1" />
    <text x="35" y="65" text-anchor="middle" font-family="sans-serif" font-size="3.0" fill="#475569">ESP-32D 55x28 (floor)</text>
    <text x="5" y="55" font-family="sans-serif" font-size="2.5" fill="#475569">↓ USB-C bottom MDF hole (15mm under-board)</text>
  </g>

  <g id="five_buttons_row">
    <!-- 5 buttons along Y=98 mm, 21 mm center-to-center: X = 18, 39, 60, 81, 102 -->
    <!-- Shown with Ø 12.5 mm reference circles; adjust diameter to match your exact button caps -->
    <g fill="none" stroke="#dc2626" stroke-width="0.35">
      <circle cx="18"  cy="98" r="6.25" />
      <circle cx="39"  cy="98" r="6.25" />
      <circle cx="60"  cy="98" r="6.25" />
      <circle cx="81"  cy="98" r="6.25" />
      <circle cx="102" cy="98" r="6.25" />
    </g>
    <g text-anchor="middle" font-family="sans-serif" font-size="3.0" fill="#475569">
      <text x="18"  y="99">P1</text>
      <text x="39"  y="99">P2</text>
      <text x="60"  y="99">P3</text>
      <text x="81"  y="99">BACK</text>
      <text x="102" y="99">PAY</text>
      <text x="60"  y="110.5" font-size="2.6">5 buttons @ Y=98mm, 21mm pitch (verify cutout Ø with calipers)</text>
    </g>
  </g>
</svg>
